name: Build Playwright image

on:
  push:
    branches: [main]
    paths:
      - 'docker/playwright/**'
      - '.github/workflows/build-playwright-image.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/playwright/Dockerfile
          target: playwright-dev
          build-args: PW_VERSION=1.58.2
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/playwright-chromium:latest
            ghcr.io/${{ github.repository_owner }}/playwright-chromium:1.58.2
