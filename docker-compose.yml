services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Keep for potential admin interface
    volumes:
      - ./docker/dev-certificates:/certs:ro
      - ./docker/dev-certificates/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - ash_learning_network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  db:
    image: postgres:18
    environment:
      - "POSTGRES_USER=ash_learning"
      - "POSTGRES_PASSWORD=secret"
    volumes:
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
      - postgres_data:/var/lib/postgresql
    ports:
      - "5436:5432"
    networks:
      - ash_learning_network

  mailpit:
    image: axllent/mailpit
    container_name: ash_learning_mailpit
    ports:
      - 1025:1025
      - 8025:8025
    networks:
      - ash_learning_network

  playwright:
    build:
      context: .
      dockerfile: ./docker/playwright/Dockerfile
      target: playwright-dev
      args:
        DOMAIN: ashlearning.dev
    ports:
      - "3000:3000"
    volumes:
      - ./docker/dev-certificates:/tmp/ssl:ro
    environment:
      - DISPLAY=:99
      - NODE_EXTRA_CA_CERTS=/tmp/ssl/rootCA.pem
      - SSL_CERT_FILE=/tmp/ssl/rootCA.pem
      - SSL_CERT_DIR=/tmp/ssl
    extra_hosts:
      - "ashlearning.dev:host-gateway"
      - "app.ashlearning.dev:host-gateway"
      - "vite.ashlearning.dev:host-gateway"
    networks:
      - ash_learning_network
    init: true
    ipc: host
    depends_on:
      - caddy

volumes:
  postgres_data:

networks:
  ash_learning_network:
    name: ash_learning_network
    driver: bridge
